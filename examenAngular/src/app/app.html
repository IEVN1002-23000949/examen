
<div class="w-full min-h-screen bg-slate-50">

  <header class="bg-slate-900 px-6 py-5 shadow-md">

    <div class="max-w-7xl mx-auto flex flex-col
                md:flex-row justify-between items-center gap-4">

      <div class="text-center md:text-left">

        <h1 class="text-3xl font-bold text-white">
          Pizzería
        </h1>

        <p class="text-slate-300 mt-2">
          Quesoo
        </p>

      </div>

      <nav class="flex flex-wrap justify-center gap-3">

        <a
          routerLink="/pizzeria/pedido"
          routerLinkActive="bg-slate-700 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="px-5 py-3 rounded-lg text-slate-300
                 font-semibold hover:bg-slate-800 transition">

          Nuevo pedido

        </a>

        <a
          routerLink="/pizzeria/ventas"
          routerLinkActive="bg-slate-700 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="px-5 py-3 rounded-lg text-slate-300
                 font-semibold hover:bg-slate-800 transition">

          Consulta de ventas

        </a>

      </nav>

    </div>

  </header>

  <main class="max-w-7xl mx-auto py-6 px-4">

    <router-outlet></router-outlet>

  </main>

</div>
